events {}

http {

    # Logging ( managed by docker )
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Gzip Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    upstream client {
        server client:80;
    }
    upstream server {
        keepalive 32;
        
        # if any req fails, nginx stop sending request to that server for 10 sec
        server server1:3000 max_fails=1 fail_timeout=10s;
        server server2:3000 max_fails=1 fail_timeout=10s;
        server server3:3000 max_fails=1 fail_timeout=10s;
    }

    server {

        listen 80;

        server_tokens off;

        # Security headers
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
        add_header Content-Security-Policy "default-src 'self';";

        # Nginx health check
        location = /health {
            access_log off;
            return 200 "Healthy";
            add_header Content-Type text/plain;
        }
        
        location / {
            proxy_pass http://client;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/{
            proxy_pass http://server;

            # For any server failure, it sends req to another server
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}